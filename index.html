<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open File</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --accent: #4752c4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1d; --fg: #ececec; --muted: #9a9a9f; --accent: #8a93f0; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 560px; margin: 12vh auto; padding: 0 16px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  code { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening your file…</h1>
  <a class="btn" id="go" href="#" hidden>Open to edit</a>
  <code id="path"></code>
  <p id="note"></p>
</main>
<script>
  // The target link sits after "#", which the browser never sends to the server.
  // Only links that open a file in Obsidian or VS Code are followed.
  var target = "";
  try { target = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  var ok = /^(obsidian:\/\/open\?path=|vscode:\/\/file\/)/.test(target);
  var title = document.getElementById("title");
  if (!ok) {
    title.textContent = "This link doesn't point to a file.";
  } else {
    var isObsidian = target.indexOf("obsidian:") === 0;
    var path = isObsidian
      ? decodeURIComponent(target.slice("obsidian://open?path=".length))
      : decodeURIComponent(target.slice("vscode://file".length));
    var go = document.getElementById("go");
    go.href = target;
    go.textContent = "Open to edit in " + (isObsidian ? "Obsidian" : "VS Code");
    go.hidden = false;
    document.getElementById("path").textContent = path;
    document.getElementById("note").textContent =
      "If nothing opened, click the button. These files live on the Mac, so this only works there.";
    location.href = target;
  }
</script>
</body>
</html>
